services:

  proxy:
    image: nawaphon2539/microservice_play-circuit_breaker-proxy:2.0.0
    env_file:
      - proxy/proxy-vars.env
    ports:
      - "1001:8080"
    networks:
      default:
        ipv4_address: 192.168.10.2

  real_service:
    image: nawaphon2539/microservice_play-circuit_breaker-real_service:2.0.0
    env_file:
      - real_service/real_service-vars.env
    ports:
      - "1002:8080"
    networks:
      default:
        ipv4_address: 192.168.10.3


networks:
  default:
    ipam:
      config:
        - subnet: 192.168.10.0/29
          gateway: 192.168.10.1
