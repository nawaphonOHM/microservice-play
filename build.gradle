import org.springframework.boot.gradle.tasks.bundling.BootBuildImage

plugins {
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version "${springBootDependencyManagement}" apply false
    id 'com.google.protobuf' version "${protobufPluginVersion}" apply false
    id 'java'
}

subprojects {
    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion as int)
        }
    }

    tasks.withType(BootBuildImage).configureEach {

        def dockerHub = project.findProperty("dockerHub") as String

        imageName = "docker.io/$dockerHub/${project.name}:${project.version}"
    }
}

jar {
    enabled = false
}
