services:

  servicesRegistry:
    image: nawaphon2539/microservice_play-client_side_discovery-services_registry:1.0.0
    env_file:
      - services_registry/services-registry-vars.env
    ports:
      - "1001:8761"
    networks:
      default:

  service_a:
    image: nawaphon2539/microservice_play-client_side_discovery-services_a:1.0.0
    env_file:
      - serviceA/service-a-vars.env
    ports:
      - "1003-1006:8080"
    networks:
      default:
    deploy:
      mode: replicated
      replicas: 4

  client:
    image: nawaphon2539/microservice_play-client_side_discovery-client:1.0.0
    env_file:
      - client/client-vars.env
    ports:
      - "1002:8080"
    networks:
      default:


networks:
  default:
