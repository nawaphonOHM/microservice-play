name: Every Night Task
on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  spring-boot-build-image:
    runs-on: ubuntu-latest

    steps:
      - name: checkout codebase
        uses: actions/checkout@v4

      - name: Setting up tool for project
        uses: ./.github/actions/setup_tools

      - name: gradlew bootBuildImage and push images
        run: |
          ./gradlew -PdockerHub=${{ secrets.DOCKER_USERNAME }} --publishImage bootBuildImage --scan \
          -Ddocker.publishRegistry.username=${{ secrets.DOCKER_USERNAME }} \
          -Ddocker.publishRegistry.password=${{ secrets.DOCKER_SECRET }}
        shell: bash