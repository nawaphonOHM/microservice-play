name: containerization-for-verson-1.0.0
on:
  workflow_dispatch:


jobs:
  spring-boot-build-image:
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'build-container'))

    steps:
      - name: checkout codebase
        uses: actions/checkout@v7

      - name: JDK=25;ARCH=x64
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          architecture: x64
          distribution: 'oracle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: 'true'
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: gradlew build and push images
        env:
          DOCKER_HUB_REPOSITORY_NAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          containerize() {
            local PATH_="$1"
            local DOCKER_FILE="$2"

            local CURRENT_WD
            CURRENT_WD=$(SUB_STR=${PATH_:0:-${#DOCKER_FILE}} && cd "$SUB_STR" && pwd)

            local JAR_FILE
            JAR_FILE=$(find "$CURRENT_WD" -name '*1.0.0.jar')
            JAR_FILE=$(grep --only-matching --extended-regexp '[^/]+$' <<< "$JAR_FILE")

            local PRE_TAG_NAME
            PRE_TAG_NAME="${JAR_FILE//.jar/}"
            PRE_TAG_NAME="${PRE_TAG_NAME//-1.0.0/:1.0.0}"

            local DOCKER_HUB_REPOSITORY_NAME="$3"

            local TAG_NAME
            TAG_NAME="$DOCKER_HUB_REPOSITORY_NAME"/"$PRE_TAG_NAME"

            docker build "$CURRENT_WD" --tag "$TAG_NAME" && docker push "$TAG_NAME"
          }
          
          ./gradlew clean build -Pversion=1.0.0
          
          DOCKER_FILE='Dockerfile'
          
          DOCKER_FILE_DIRS=$(find . -name "$DOCKER_FILE")
          
          mapfile -t PATHS <<< "$DOCKER_FILE_DIRS"
          
          for PATH_ in "${PATHS[@]}" ; do
            containerize "$PATH_" "$DOCKER_FILE" "$DOCKER_HUB_REPOSITORY_NAME" &
          done
          
          wait
          
          echo Done!

